name: Build OpenWrt x86_64 Brain

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/ljty06/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 释放磁盘空间
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        df -hT

    - name: 初始化环境（完整依赖清单，来自 P3TERX/Actions-OpenWrt）
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 拉取源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 更新并安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 应用厂商配置并禁用问题包
      run: |
        cd openwrt
        cp config_73.buildinfo .config
        sed -i 's/^CONFIG_PACKAGE_vlmcsd=y/# CONFIG_PACKAGE_vlmcsd is not set/' .config
        sed -i 's/^CONFIG_PACKAGE_luci-app-vlmcsd=y/# CONFIG_PACKAGE_luci-app-vlmcsd is not set/' .config
        sed -i 's/^CONFIG_PACKAGE_odhcpd=y/# CONFIG_PACKAGE_odhcpd is not set/' .config
        sed -i 's/^CONFIG_PACKAGE_odhcpd=m/# CONFIG_PACKAGE_odhcpd is not set/' .config
        sed -i 's/^CONFIG_PACKAGE_odhcpd-ipv6only=y/# CONFIG_PACKAGE_odhcpd-ipv6only is not set/' .config
        sed -i 's/^CONFIG_PACKAGE_odhcpd-ipv6only=m/# CONFIG_PACKAGE_odhcpd-ipv6only is not set/' .config
        sed -i 's/^CONFIG_PACKAGE_tcpdump=y/# CONFIG_PACKAGE_tcpdump is not set/' .config
        sed -i 's/^CONFIG_PACKAGE_tcpdump=m/# CONFIG_PACKAGE_tcpdump is not set/' .config
        make defconfig
        grep -E '^CONFIG_TARGET_x86' .config | head -3

    - name: 预下载源码包并清理损坏文件
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译（失败自动降级单线程重试）
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: 整理产物
      if: success()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 上传固件 Artifact
      uses: actions/upload-artifact@main
      if: success()
      with:
        name: openwrt-images
        path: ${{ env.FIRMWARE }}

    - name: 发布到 Release（免登录下载）
      uses: softprops/action-gh-release@master
      if: success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: brain-build-${{ github.run_number }}
        files: ${{ env.FIRMWARE }}/*
