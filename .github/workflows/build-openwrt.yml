name: Build OpenWrt x86_64 (Brain)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 释放磁盘空间
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
        sudo apt-get clean
        df -h /

    - name: 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget

    - name: 拉取源码
      run: git clone --depth 1 https://github.com/ljty06/lede.git openwrt

    - name: 应用厂商配置（build 73）
      run: |
        cd openwrt
        cp config_73.buildinfo .config
        make defconfig
        echo "=== 目标确认 ==="
        grep -E "^CONFIG_TARGET_x86" .config | head -3

    - name: 编译
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: 上传镜像产物
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-x86-64-images
        path: |
          openwrt/bin/targets/x86/64*/*img.gz
          openwrt/bin/targets/x86/64*/sha256sums
        if-no-files-found: error
